# 字体宽度数据文件，如果不存在，将读取内置的字体宽度数据
fonts-file: 'fonts.nbt'
# 仅在资源包实际修改了步进时覆盖宽度；原版汉字步进为 9，不需要比例补偿
font-advance-overrides: {}
# 客户端是否开启强制 Unicode 字体，这将影响字体宽度计算逻辑
forces-unicode-font: false
# 客户端行距为 10 像素（字高 9 + 行间距 1），与文字/背景的单行高度不同
line-height: 10
# 准心悬停检查定时器的运行周期 (tick)
# 数值越小，对服务器压力越大，但菜单更新也越流畅
timer-period: 1
